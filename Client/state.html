<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
        .container { max-width: 1000px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; }
        .cart-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .cart-btn:hover { color: #FF5722; }
        .loading { text-align: center; font-size: 18px; color: #666; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .item {
            padding: 15px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }
        .item img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 5px;
        }
        .item h3 { margin: 10px 0 5px; font-size: 18px; }
        .price { font-weight: bold; color: #28a745; }
        .info-icon {
            font-size: 18px;
            cursor: pointer;
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #666;
        }
        .info-icon:hover { color: #000; }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .info-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
        }
        .close-btn:hover { color: #cc0000; }
    </style>
</head>
<body>

    <button class="cart-btn" onclick="goToCart()">🛒</button>

    <div class="container">
        <h1 id="state-title">Loading...</h1>
        <div id="data-container" class="grid">
            <p class="loading">Fetching items...</p>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="info-box">
            <span class="close-btn" onclick="closeInfoBox()">✖</span>
            <p id="info-content"></p>
        </div>
    </div>

    <script>
        async function fetchFilteredItems() {
            const urlParams = new URLSearchParams(window.location.search);
            const state = urlParams.get('state');
            document.getElementById('state-title').innerText = `Items in ${state}`;

            const dataContainer = document.getElementById('data-container');
            dataContainer.innerHTML = '<p class="loading">Loading items...</p>';

            try {
                const response = await fetch(`http://localhost:5000/api/items?state=${state}`);
                if (!response.ok) throw new Error("Failed to fetch items");
                
                const items = await response.json();

                if (items.length === 0) {
                    dataContainer.innerHTML = "<p>No items found for this state.</p>";
                    return;
                }

                dataContainer.innerHTML = items.map(item => `
    <div class="item">
        <img src="${item.image || 'placeholder.jpg'}" alt="${item.name}">
        <h3>${item.name}</h3>
        <p class="price">₹${item.cost}</p>
        <button onclick="addToCart('${item.id}', '${item.name}', '${item.cost}', '${item.image || 'placeholder.jpg'}')">Add to Cart</button>
        <span class="info-icon" onclick="showInfo('${item.description}')">🛈</span>
    </div>
`).join('');

            } catch (error) {
                console.error("Error fetching items:", error);
                dataContainer.innerHTML = '<p>Error loading items</p>';
            }
        }

        function addToCart(itemId, name, cost, image) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let existingItem = cart.find(item => item.id === itemId);

    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ id: itemId, name, cost, image, quantity: 1 });
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    
}

        function goToCart() {
            window.location.href = "cart.html";
        }

        function showInfo(description) {
            document.getElementById("info-content").innerText = description;
            document.getElementById("overlay").style.display = "flex";
        }

        function closeInfoBox() {
            document.getElementById("overlay").style.display = "none";
        }

        window.addEventListener('pageshow', fetchFilteredItems);
    </script>

</body>
</html>
